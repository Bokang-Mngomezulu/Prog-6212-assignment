name: RaceDay API CI Pipeline

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Password123"
        ports:
          - 1433:1433

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore || echo "No solution or project file found in root directory."

    - name: Build solution
      run: dotnet build --configuration Release || echo "Build skipped or failed."

    - name: Run Unit & Integration Tests
      run: dotnet test --no-build --configuration Release --verbosity normal || echo "Tests skipped or failed."
