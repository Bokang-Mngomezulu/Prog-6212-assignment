name: RaceDay API CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-planning-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Verify Planning Documents
      run: |
        echo "Checking submission requirements..."
        test -f SQLQuery1Poepart1.sql || (echo "SQL script missing!" && exit 1)
        test -f Bokang Mngomezulu poe part 1 || (echo "Bokang Mngomezulu poe part 1 missing!" && exit 1)
        echo "All required artifacts successfully verified!"
